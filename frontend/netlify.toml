[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# SPA fallback: all routes → index.html (React Router handles them)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: custom headers for caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
